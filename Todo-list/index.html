<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
    <style>
        #task{
            width: 300px;
            border: 2px solid lightgrey;
            border-radius: 5px;
            padding: 5px;
            outline: #fff;
        }
        #todo{
            display: flex;
            justify-content: center;
            align-items: center;
            height: 90vh;
        }
        #add{
            background-color: rgb(255, 64, 0); 
            color: #fff; 
            border: none;
            padding: 4px 8px;
            border-radius: 5px;
            cursor:pointer;
        }
        .container{
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: start;
            width: 1000px;
            gap: 10px;
            border: 2px solid lightgrey;
            border-radius: 8px;
            height: 70vh;
            background-color: #fff;
        }
        #itemslist{
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 800px;
            background-color: rgb(6, 158, 246);
            color: #fff;
            border-radius: 10px;
        }
        #itemslist > P{
            padding-left: 8px;
            width: 800px;
        }
        #btns{
                width: 180px;
                text-align: end;
            }
        #btns > button{
            border-radius: 5px;
            margin-right: 5px;
            border: none;
            font-style: italic;
            background-color: rgb(2, 0, 12);
            color:#fff;
            cursor: pointer;
        }
        @media screen and (max-width:480px ){
            #task{
                width: 150px;
                padding: 2.5px;
            }
            #add{
            padding: 2px 4px;
            border-radius: 5px;
            font-size: 12px;
        }
            .container{
                width: 380px;
                height: 50vh;
            }
            #itemslist{
                width: 350px;
                font-size: 12px;
            }
            #itemslist > p{
                width: 350px;
            }
            #btns{
                width: 100px;
            }
            #btns > button{
                font-size: 10px;
                margin-right: 2px;
            }
        }
    </style>
</head>
<body>
    <div id="todo">
    <div class="container">
    <h2>Tasks To Do</h2>
    <div>
    <input type="text" placeholder="Enter Your Task" id="task" >
    <button id="add">ADD</button> </div>
    <div id="todo_container">
    </div>
</div></div>
   <script src="./index.js"></script>
</body>
</html>
